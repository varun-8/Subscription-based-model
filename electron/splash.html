<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starting System...</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

        :root {
            --bg: #ffffff;
            --primary: #3b82f6;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --loader-bg: #e2e8f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: var(--bg);
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            overflow: hidden;
            user-select: none;
            color: var(--text-main);
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 100%;
            max-width: 400px;
            padding: 2rem;
        }

        .logo-wrapper {
            margin-bottom: 2.5rem;
            animation: fadeInDown 0.8s ease-out;
        }

        .logo {
            width: 180px;
            height: auto;
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.05));
        }

        .content {
            width: 100%;
            animation: fadeInUp 0.8s ease-out 0.2s backwards;
        }

        .subtitle {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 1.5rem;
            letter-spacing: -0.01em;
        }

        .loader-box {
            width: 100%;
            padding: 2rem;
            background: #f8fafc;
            border-radius: 16px;
            border: 1px solid #f1f5f9;
            box-shadow: 0 4px 20px -4px rgba(0, 0, 0, 0.04);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: var(--loader-bg);
            border-radius: 100px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            width: 40%;
            background: var(--primary);
            border-radius: 100px;
            position: absolute;
            left: -40%;
            animation: loading 2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        .status-text {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .footer {
            position: absolute;
            bottom: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            animation: fadeIn 1s ease-out 0.8s backwards;
        }

        .divider {
            width: 32px;
            height: 2px;
            background: #e2e8f0;
            border-radius: 2px;
        }

        .dev-text {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 0.02em;
        }

        .team {
            color: var(--primary);
            font-weight: 700;
        }

        @keyframes loading {
            0% {
                left: -40%;
                width: 20%;
            }

            50% {
                width: 40%;
            }

            100% {
                left: 100%;
                width: 20%;
            }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="logo-wrapper">
            <img src="logo.png" alt="Logo" class="logo">
        </div>

        <div class="content">
            <div class="subtitle">Offline Magazine Management</div>

            <div class="loader-box">
                <div class="progress-bar">
                    <div class="progress-fill"></div>
                </div>
                <div class="status-text">Starting System</div>
            </div>
        </div>
    </div>

    <div class="footer">
        <div class="divider"></div>
    </div>
</body>

</html>
